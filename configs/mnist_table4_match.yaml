# MNIST config matching FilterFL's Table 4 (non-IID alpha=0.5, eta=0.1 i.e. 10%
# malicious). Benign-side values (100 global epochs, 1 local epoch, lr=0.1,
# dirichlet_alpha=0.5, 100 total clients/10 sampled) are the paper's stated
# MNIST setup. Malicious-side values (poison_epochs=10, poison_lr=0.05,
# poison_rate=0.5, target_class=2) are from FilterFL's arXiv v2 appendix,
# Table VII ("detailed setup of local training for the adversarial clients"),
# NOT a proportional guess from the CIFAR config. Caveat: this is the arXiv v2
# appendix specifically -- the CCS camera-ready may differ (the paper's general
# default poisoning rate changed from 0.5 to 0.3 between versions elsewhere in
# this project's notes), so poison_rate=0.5 here should be read as "arXiv v2's
# MNIST-specific value," not necessarily the camera-ready's.
type: MNIST
algorithm: FedAvg
epochs: 100
eta: 1.0
local_epochs: 1
batch_size: 128
num_clients: 10
number_of_total_participants: 100
lr: 0.1
lr_decay: false
lr_decay_epoch: 1
lr_decay_gamma: 0.998
momentum: 0.9
decay: 0.0005

sampling_dirichlet: true
dirichlet_alpha: 0.5

is_poison: true
poison_epochs: 10      # arXiv v2 Table VII
poison_lr: 0.05        # arXiv v2 Table VII
poison_rate: 0.5       # arXiv v2 Table VII
trigger_num: 1
poison_client_num: 10
poison_patterns:
  0: [[0,0],[0,1],[0,2],[0,3],[0,6],[0,7],[0,8],[0,9],[3,0],[3,1],[3,2],[3,3],[3,6],[3,7],[3,8],[3,9]]
target_class: 2        # arXiv v2 Table VII -- NOT 0

defence_method: none   # overridden by --defense at the CLI

rho_schedule:
  breakpoints: [0, 500, 1000, 1500]
  values: [0.50, 0.40, 0.30, 0.20]

gan:
  gamma: 0.75
  lambda_: 0.125
  stage1_rounds: 10
  stage2_rounds: 5
  generator_lr: 0.0005
  adam_b1: 0.5
  adam_b2: 0.999
  images_per_class: 32
  latent_dim: 100
  use_first_stage2_batch_only: true

schedule:
  enabled: false
  k: 10
  randomized: false
  non_detection_round_policy: last_filter

trust:
  enabled: false
  accumulation_rate: 0.1
  decay_rate: 0.2
  exclusion_threshold: -1.0
  initial_trust: 0.0

seed: 1
device: cuda
results_dir: results
run_name: mnist_table4_match
