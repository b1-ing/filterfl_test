# Stage-2 ablation test (CODE_NOTES.md), paper's primary headline alpha=0.5.
# Identical to cifar_alpha1_side_class7.yaml / cifar_alpha0.1_class7.yaml
# except dirichlet_alpha=0.5.
type: CIFAR10
algorithm: FedAvg
epochs: 2000
eta: 1.0
local_epochs: 2
batch_size: 128
num_clients: 10
number_of_total_participants: 100
lr: 0.01
lr_decay: true
lr_decay_epoch: 1
lr_decay_gamma: 0.998
momentum: 0.9
decay: 0.0005

sampling_dirichlet: true
dirichlet_alpha: 0.5

is_poison: true
poison_epochs: 6
poison_lr: 0.005
poison_rate: 0.5
trigger_num: 1
poison_client_num: 10
poison_patterns:
  0: [[0,0],[0,1],[0,2],[0,3],[0,6],[0,7],[0,8],[0,9],[3,0],[3,1],[3,2],[3,3],[3,6],[3,7],[3,8],[3,9]]
target_class: 7

defence_method: none   # overridden by --defense at the CLI

rho_schedule:
  breakpoints: [0, 500, 1000, 1500]
  values: [0.50, 0.40, 0.30, 0.20]

gan:
  gamma: 0.75
  lambda_: 0.125
  stage1_rounds: 10
  stage2_rounds: 5
  generator_lr: 0.0005
  adam_b1: 0.5
  adam_b2: 0.999
  images_per_class: 32
  latent_dim: 100
  use_first_stage2_batch_only: true
  stage2_loss: paper

stage3_probe_mode: train

schedule:
  enabled: false
  k: 10
  randomized: false
  non_detection_round_policy: last_filter

trust:
  enabled: false
  accumulation_rate: 0.1
  decay_rate: 0.2
  exclusion_threshold: -1.0
  initial_trust: 0.0

seed: 1
device: cuda
results_dir: results
run_name: run
