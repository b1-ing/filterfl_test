# GTSRB config — added for Stage-2 ablation across C=43 classes.
#
# Architecture and GAN are the same as CIFAR-10: ResNet-8 accepts num_classes
# as a parameter, and GeneratorCIFAR outputs 32x32 which matches the resized
# GTSRB images. The only structural difference is num_classes=43 (set
# automatically from load_dataset("GTSRB")).
#
# Trigger pattern: same pixel coordinates as CIFAR-10 primary config. Pattern
# sits in the top-left corner of a 32x32 image — valid and visible on GTSRB
# at this resolution.
#
# Number of clients/participants kept identical to CIFAR-10 primary so that
# the ONLY variable changing between the CIFAR-10 and GTSRB ablation tables
# is the dataset (and thus C). Do not change these numbers without noting it.
type: GTSRB
algorithm: FedAvg
epochs: 500
eta: 1.0
local_epochs: 2
batch_size: 128
num_clients: 10
number_of_total_participants: 100
lr: 0.01
lr_decay: true
lr_decay_epoch: 1
lr_decay_gamma: 0.998
momentum: 0.9
decay: 0.0005

sampling_dirichlet: true
dirichlet_alpha: 0.5

is_poison: true
poison_epochs: 6
poison_lr: 0.005
poison_rate: 0.25
trigger_num: 1
poison_client_num: 10
poison_patterns:
  0: [[0,0],[0,1],[0,2],[0,3],[0,6],[0,7],[0,8],[0,9],[3,0],[3,1],[3,2],[3,3],[3,6],[3,7],[3,8],[3,9]]
target_class: 0

defence_method: none   # overridden by --defense at the CLI

rho_schedule:
  breakpoints: [0, 500, 1000, 1500]
  values: [0.50, 0.40, 0.30, 0.20]

gan:
  gamma: 0.75
  lambda_: 0.125
  stage1_rounds: 10
  stage2_rounds: 5
  generator_lr: 0.0005
  adam_b1: 0.5
  adam_b2: 0.999
  images_per_class: 32
  latent_dim: 100
  stage2_loss: reference
  use_first_stage2_batch_only: true

schedule:
  enabled: false
  k: 10
  randomized: false
  non_detection_round_policy: last_filter

trust:
  enabled: false
  accumulation_rate: 0.1
  decay_rate: 0.2
  exclusion_threshold: -1.0
  initial_trust: 0.0

seed: 0
device: cuda
results_dir: results
run_name: run
