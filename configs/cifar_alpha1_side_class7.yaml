# Class-7 generalization test (CODE_NOTES.md): identical to cifar_alpha1_side.yaml
# except target_class=7. Class 0 was found to be a moderate Stage-2 attractor
# (50% self-match in the sink sweep); class 7 was a zero-sink. Tests whether
# detection, and the "T isn't round-specific" finding, hold when the attacker
# targets a class Stage 2 does NOT naturally gravitate to on its own, rather
# than one that coincides with Stage 2's default destination. Poison pattern
# (poison_patterns index 0) deliberately UNCHANGED from cifar_alpha1_side.yaml.
type: CIFAR10
algorithm: FedAvg
epochs: 2000
eta: 1.0
local_epochs: 2
batch_size: 128
num_clients: 10
number_of_total_participants: 100
lr: 0.01
lr_decay: true
lr_decay_epoch: 1
lr_decay_gamma: 0.998
momentum: 0.9
decay: 0.0005

sampling_dirichlet: true
dirichlet_alpha: 1.0

is_poison: true
poison_epochs: 6
poison_lr: 0.005
poison_rate: 0.5
trigger_num: 1
poison_client_num: 10
poison_patterns:
  0: [[0,0],[0,1],[0,2],[0,3],[0,6],[0,7],[0,8],[0,9],[3,0],[3,1],[3,2],[3,3],[3,6],[3,7],[3,8],[3,9]]
target_class: 7

defence_method: none   # overridden by --defense at the CLI

rho_schedule:
  breakpoints: [0, 500, 1000, 1500]
  values: [0.50, 0.40, 0.30, 0.20]

gan:
  gamma: 0.75
  lambda_: 0.125
  stage1_rounds: 10
  stage2_rounds: 5
  generator_lr: 0.0005
  adam_b1: 0.5
  adam_b2: 0.999
  images_per_class: 32
  latent_dim: 100
  use_first_stage2_batch_only: true
  stage2_loss: paper

stage3_probe_mode: train

schedule:
  enabled: false
  k: 10
  randomized: false
  non_detection_round_policy: last_filter

trust:
  enabled: false
  accumulation_rate: 0.1
  decay_rate: 0.2
  exclusion_threshold: -1.0
  initial_trust: 0.0

seed: 1
device: cuda
results_dir: results
run_name: run
